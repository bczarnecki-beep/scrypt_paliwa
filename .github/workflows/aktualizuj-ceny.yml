name: Aktualizuj ceny paliw

on:
  schedule:
    - cron: "30 4 * * *"   # codziennie 04:30 UTC = 6:30 (lato) / 5:30 (zima) czasu polskiego
  workflow_dispatch:        # przycisk „Run workflow” – ręczne uruchomienie

permissions:
  contents: write

concurrency:
  group: ceny-paliw
  cancel-in-progress: false

jobs:
  ceny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pobierz ceny
        run: python pobierz_ceny.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "ceny-paliw-bot"
          git config user.email "actions@users.noreply.github.com"
          git add ceny.json historia.csv
          if git diff --cached --quiet; then
            echo "Brak zmian."
          else
            git commit -m "Ceny paliw $(date -u +%F)"
            git push
          fi
